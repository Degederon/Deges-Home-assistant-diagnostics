<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a4a"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#03a9f4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#03a9f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512"/>
  </g>
  <!-- house outline -->
  <path d="M112 248 L256 128 L400 248 V392 Q400 408 384 408 H128 Q112 408 112 392 Z"
        fill="#0f3557" fill-opacity="0.55" stroke="#e3f2fd" stroke-width="22" stroke-linejoin="round"/>
  <!-- pulse line -->
  <path d="M60 300 H170 L198 252 L232 352 L268 214 L298 300 H452"
        fill="none" stroke="url(#pulse)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <!-- check badge -->
  <circle cx="392" cy="392" r="78" fill="#06131f"/>
  <circle cx="392" cy="392" r="64" fill="#2ecc71"/>
  <path d="M362 393 L384 415 L424 372" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
